<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f1f8f0">
<title>Botying Payment ♡</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Prompt:wght@300;400;500;600&display=swap');
:root{--pink:#83b58b;--deep:#477d54;--cream:#f8fcf6;--ink:#526b56;--line:#d8e8d7}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font-family:'Prompt','Kanit',sans-serif;background:radial-gradient(circle at 15% 15%,#e0f0df 0 2px,transparent 3px),radial-gradient(circle at 88% 24%,#d7ead7 0 3px,transparent 4px),linear-gradient(145deg,#f8fcf6,#edf6eb 55%,#f8fcf6);padding:28px 14px 48px}
.wrap{max-width:520px;margin:auto}
.brand{text-align:center;margin:5px 0 18px}
.brand .heart{font-size:27px;color:#e7a1bd}
.brand h1{font-size:25px;font-weight:500;margin:3px 0;color:#bd7897}
.brand p{font-size:12px;color:#91a894;margin:0}
.panel{background:rgba(255,253,249,.91);border:1px solid #e0ebdd;border-radius:27px;padding:24px 22px;box-shadow:0 14px 40px #9bbf9b1c;position:relative;overflow:hidden}
.panel:before{content:"♡";position:absolute;left:13px;top:100px;color:#b7d7b8;font-size:25px}
h2{font-size:17px;font-weight:500;text-align:center;margin:0 0 7px;color:#62866a}
.sub{text-align:center;font-size:12px;line-height:1.8;color:#a88b98;margin:0 0 19px}
.account-name{color:#5e9b68;font-weight:600}
.notice{background:#f0f7ee;border:1px solid #dcebd9;border-radius:17px;padding:13px;text-align:center;font-size:12px;line-height:1.7;margin:0 auto 20px;max-width:300px}
.notice strong{color:#5c9365}
.section-label{text-align:center;font-size:12px;color:#b58da0;margin:10px 0 12px}
.pay-card{display:flex;align-items:center;gap:12px;background:#fcfefb;border:1px solid #dce9dc;border-radius:18px;padding:12px;margin:10px 0;box-shadow:0 3px 12px #a9c6a91a}
.bank-icon{width:39px;height:39px;border-radius:50%;display:grid;place-items:center;font-size:18px;font-weight:600;flex:none;background:#e2f1e2;color:#287a3c}
.wallet .bank-icon{background:#eaf4e8;color:#4f8e58}
.detail{min-width:0;flex:1}
.detail small{display:block;color:#b39aa5;font-size:10px}
.number{font-size:18px;font-weight:600;letter-spacing:.3px;color:#347a43}
.wallet .number{color:#4b8752}
.copy{border:0;border-radius:22px;padding:9px 13px;background:#e8f3e6;color:#4d8557;font:inherit;font-size:11px;cursor:pointer;white-space:nowrap}
.copy:active{transform:scale(.97)}
.hint{text-align:center;font-size:10px;color:#91a894;margin:13px 0 18px}
.qrbox{border:1px dashed #c7dfc5;background:#f4faf2;border-radius:21px;padding:14px;text-align:center}
.qrbox img{display:block;max-width:100%;max-height:280px;object-fit:contain;margin:0 auto 10px;border-radius:12px}
.qr-placeholder{height:180px;display:grid;place-items:center;color:#86a98a;font-size:13px;line-height:1.8}
.upload{display:inline-block;border-radius:24px;padding:9px 16px;background:#e8f3e6;color:#4d8557;font-size:11px;cursor:pointer}
input[type=file]{display:none}
.save{width:100%;margin-top:10px;border:1px solid #c8dfc6;background:#fcfefb;color:#66886a;border-radius:24px;padding:12px;font:inherit;font-size:12px;cursor:pointer}
.more{margin-top:17px;background:#fff7fa;border:1px solid #d8e8d7;border-radius:21px;padding:16px}
.more h3{margin:0 0 12px;color:#5d9466;font-size:15px;font-weight:500}
.row{display:flex;gap:8px;align-items:center}
.message{flex:1;min-width:0;border:1px solid #dce9da;background:#fcfefb;border-radius:13px;padding:10px;color:#927b87;font:inherit;font-size:11px}
.small-copy{border:0;background:#e8f3e6;color:#4d8557;border-radius:14px;padding:10px;font:inherit;font-size:10px;cursor:pointer}
.slip{display:block;margin-top:13px;padding:10px 2px 0;border:0;border-top:1px solid #dce9da;background:none;color:#6b956e;font:inherit;font-size:12px;width:100%;text-align:left;cursor:pointer}
#slipInput{margin-top:10px}
.footer{text-align:center;font-size:10px;color:#9aaf9b;margin:17px 0 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:#456d4b;color:white;padding:10px 17px;border-radius:30px;font-size:12px;transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:380px){.panel{padding:20px 15px}.number{font-size:16px}.copy{padding:8px 10px}}
</style>
</head>
<body>
<main class="wrap">
<section class="panel">
<div class="pay-card">
      <div class="detail"><div class="number">1653779972</div></div>
      <button class="copy" data-copy="1653779972">▢ คัดลอก</button>
    </div>
    <div class="pay-card wallet">
      <div class="detail"><div class="number">061216751</div></div>
      <button class="copy" data-copy="061216751">▢ คัดลอก</button>
    </div>
    <div class="qrbox">
      <div id="qrPlaceholder" class="qr-placeholder">♡ พื้นที่สำหรับใส่รูปภาพ ♡<br><small>กดปุ่มด้านล่างเพื่อเลือกรูปจากเครื่อง</small></div>
      <img id="qrImage" alt="รูปภาพที่เพิ่ม" hidden>
      <label class="upload" for="qrUpload">＋ เพิ่มรูปภาพ</label>
      <input id="qrUpload" type="file" accept="image/*">
      <button class="save" id="saveQr">↓ บันทึกรูปภาพ</button>
    </div>
</section>
  <p class="footer">ขอบคุณที่อุดหนุนเสมอนะคะ ♡</p>
</main>
<div class="toast" id="toast">คัดลอกแล้ว ♡</div>
<script>
const toast=document.getElementById('toast');
function notify(msg='คัดลอกแล้ว ♡'){toast.textContent=msg;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800)}
async function copyText(value){try{await navigator.clipboard.writeText(value);notify()}catch(e){const t=document.createElement('textarea');t.value=value;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();notify()}}
document.querySelectorAll('[data-copy]').forEach(b=>b.addEventListener('click',()=>copyText(b.dataset.copy)));
document.getElementById('copyMemo').addEventListener('click',()=>copyText(document.getElementById('memo').value));
const qrUpload=document.getElementById('qrUpload'), qrImage=document.getElementById('qrImage'), qrPlaceholder=document.getElementById('qrPlaceholder');
qrUpload.addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;qrImage.src=URL.createObjectURL(f);qrImage.hidden=false;qrPlaceholder.hidden=true;notify('เพิ่มรูป QR แล้ว ♡')});
document.getElementById('saveQr').addEventListener('click',()=>{if(qrImage.hidden){notify('กรุณาเพิ่มรูป QR ก่อนนะคะ');return}const a=document.createElement('a');a.href=qrImage.src;a.download='botying-payment-qr.png';a.click()});
</script>
</body>
</html>
